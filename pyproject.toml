[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-management-automation"
version = "0.1.0"
description = "CLI tool to scan and organize files safely"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Emily Adams" }]
license = { text = "MIT" }
keywords = ["automation", "files", "organizer", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
fma = "fma.cli:main"

[tool.setuptools]
packages = ["fma"]
